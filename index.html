<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tailor Pro</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- KILL SWITCH: Force clear old service worker and cache on every update -->
  <script>
    (function() {
      var BUILD = 'v20-logout-bug-fix';
      if (localStorage.getItem('app_build') !== BUILD) {
        localStorage.setItem('app_build', BUILD);
        // Unregister ALL old service workers
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(reg) { reg.unregister(); });
          });
        }
        // Delete ALL caches
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(name) { caches.delete(name); });
          });
        }
        // Force reload page to fetch fresh files immediately
        window.location.reload(true);
      }
    })();
  </script>
</head>
<body>
  <!-- Authentication Screen -->
  <div id="auth-screen" class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div style="margin-bottom: 12px;">
          <img src="assets/logo.jpg" alt="Tailor Logo" style="width: 100px; height: 100px; border-radius: 50%; border: 2px solid var(--primary); object-fit: cover; box-shadow: var(--shadow-md);">
        </div>
        <h2 style="color: var(--primary);">Tailor Pro</h2>
        <p id="auth-tagline">Login or create a free account</p>
      </div>

      <!-- Install App Banner (shown in browser) -->
      <div id="install-banner" class="install-banner hidden">
        <span>📲</span>
        <span id="install-banner-text">Install this app on your phone!</span>
        <button id="install-banner-btn" class="install-banner-btn">Install</button>
      </div>
      
      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab active" data-target="login" id="tab-login" onclick="window.switchTab('login')">Login</button>
        <button class="auth-tab" data-target="register" id="tab-register" onclick="window.switchTab('register')">Register</button>
      </div>
      
      <!-- Login Form -->
      <form id="login-form-new" class="auth-form active">
        <div class="form-group">
          <label class="form-label" id="lbl-login-phone">Phone Number</label>
          <input type="tel" id="login-phone" class="form-control" placeholder="03xx-xxxxxxx" required>
        </div>
        <div class="form-group">
          <label class="form-label" id="lbl-password">Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full mt-2" id="btn-login">Login</button>
      </form>
      
      <!-- Register Form -->
      <form id="register-form-new" class="auth-form">
        <div class="form-group">
          <label class="form-label" id="lbl-shopname">Shop Name</label>
          <input type="text" id="reg-shop" class="form-control" placeholder="My Tailor Shop" required>
        </div>
        <div class="form-group">
          <label class="form-label" id="lbl-reg-phone">Phone Number</label>
          <input type="tel" id="reg-phone" class="form-control" placeholder="03xx-xxxxxxx" required>
        </div>
        <div class="form-group">
          <label class="form-label" id="lbl-email2">Email</label>
          <input type="email" id="reg-email" class="form-control" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" id="lbl-password2">Password</label>
          <input type="password" id="reg-password" class="form-control" placeholder="Min 6 characters" minlength="6" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full mt-2" id="btn-register">Create Account</button>
      </form>
    </div>
  </div>

  <div id="app" class="hidden">
    <!-- Install App Floating Button (shown in browser after login) -->
    <button id="install-fab" class="install-fab hidden" title="Install App">
      📲 <span id="install-fab-text">Install App</span>
    </button>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-page="home">
        <span class="nav-icon">🏠</span>
        <span class="nav-label" data-i18n="navHome">Home</span>
      </button>
      <button class="nav-item" data-page="customers">
        <span class="nav-icon">👥</span>
        <span class="nav-label" data-i18n="navCustomers">Customers</span>
      </button>
      <button class="nav-item" data-page="orders">
        <span class="nav-icon">📋</span>
        <span class="nav-label" data-i18n="navOrders">Orders</span>
      </button>
      <button class="nav-item" data-page="payments">
        <span class="nav-icon">💰</span>
        <span class="nav-label" data-i18n="navPayments">Payments</span>
      </button>
      <button class="nav-item" data-page="settings">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label" data-i18n="navSettings">Settings</span>
      </button>
    </nav>

    <!-- Page Containers -->
    <div id="page-home" class="page active"></div>
    <div id="page-customers" class="page"></div>
    <div id="page-orders" class="page"></div>
    <div id="page-payments" class="page"></div>
    <div id="page-settings" class="page"></div>

  </div>

  <!-- Scripts – i18n must load first -->
  <script src="js/i18n.js?v=6"></script>
  <script src="js/config.js?v=6"></script>
  <script src="js/auth.js?v=6"></script>
  <script src="js/utils.js?v=6"></script>
  <script src="js/db.js?v=6"></script>
  <script src="js/sync.js?v=6"></script>
  <script src="js/modals.js?v=6"></script>
  <script src="js/dashboard.js?v=6"></script>
  <script src="js/customers.js?v=6"></script>
  <script src="js/orders.js?v=6"></script>
  <script src="js/payments.js?v=6"></script>
  <script src="js/settings.js?v=6"></script>
  <script src="js/app.js?v=6"></script>
  <script>
    // PWA Install Prompt Logic
    let deferredPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;

      // Show install banner on auth screen
      const banner = document.getElementById('install-banner');
      if (banner) banner.classList.remove('hidden');

      // Show install FAB inside app
      const fab = document.getElementById('install-fab');
      if (fab) fab.classList.remove('hidden');
    });

    function triggerInstall() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then((choiceResult) => {
        if (choiceResult.outcome === 'accepted') {
          document.getElementById('install-banner')?.classList.add('hidden');
          document.getElementById('install-fab')?.classList.add('hidden');
        }
        deferredPrompt = null;
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('install-banner-btn')?.addEventListener('click', triggerInstall);
      document.getElementById('install-fab')?.addEventListener('click', triggerInstall);

      // ── INSTANT AUTH CHECK (bypass auth.js if cached) ──
      try {
        const tokenStr = localStorage.getItem('sb-malyhkiumfplkkwdvnab-auth-token');
        if (tokenStr) {
          const tokenData = JSON.parse(tokenStr);
          if (tokenData && tokenData.access_token) {
            document.getElementById('auth-screen')?.classList.add('hidden');
            document.getElementById('app')?.classList.remove('hidden');
          }
        }
      } catch(e) {}

      // ── SHARED SUPABASE CLIENT (single instance, no conflict) ──
      const CACHE_VERSION = 'tailor-pro-v18';
      const SB_URL = 'https://malyhkiumfplkkwdvnab.supabase.co';
      const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1hbHloa2l1bWZwbGtrd2R2bmFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2NjI5ODQsImV4cCI6MjEwMTIzODk4NH0.Kr95uaGZB1CFwJEzvpx-D-NhqeRWY3twurV-fytaQTw';
      let _sb = null;
      function getSB() {
        if (!_sb && window.supabase) _sb = window.supabase.createClient(SB_URL, SB_KEY);
        return _sb;
      }

      // ── LOGIN FORM ──────────────────────────────────────────────
      const loginForm = document.getElementById('login-form-new');
      if (loginForm) {
        loginForm.addEventListener('submit', async (e) => {
          e.preventDefault();

          const sb = getSB();
          if (!sb) { alert('Supabase load nahi hua. Page refresh karein.'); return; }

          const btn      = document.getElementById('btn-login');
          const origText = btn ? btn.textContent : 'Login';
          if (btn) { btn.textContent = 'Logging in...'; btn.disabled = true; }

          try {
            const phone    = (document.getElementById('login-phone')?.value || '').trim();
            const password = document.getElementById('login-password')?.value || '';

            if (!phone || !password) { alert('Phone aur password daalein.'); return; }

            // Step 1: Look up email by phone
            const { data: lookup, error: lookupErr } = await sb
              .from('phone_lookup').select('email').eq('phone', phone).single();

            if (lookupErr || !lookup) {
              alert('❌ Phone number registered nahi hai.\nPehle Register tab mein account banayen.');
              window.switchTab && window.switchTab('register');
              return;
            }

            // Step 2: Sign in with email + password
            const { data, error } = await sb.auth.signInWithPassword({
              email: lookup.email, password
            });

            if (error) {
              alert('❌ Login Failed: ' + error.message);
              return;
            }

            // Success – reload to trigger auth state
            window.location.reload();

          } catch(err) {
            alert('Login Error: ' + err.message);
          } finally {
            if (btn) { btn.textContent = origText; btn.disabled = false; }
          }
        });
      }

      // ── REGISTER FORM ───────────────────────────────────────────
      const regForm = document.getElementById('register-form-new');
      if (regForm) {
        regForm.addEventListener('submit', async (e) => {
          e.preventDefault();

          const sb = getSB();
          if (!sb) { alert('Supabase load nahi hua. Page refresh karein.'); return; }

          const btn      = document.getElementById('btn-register');
          const origText = btn ? btn.textContent : 'Create Account';
          if (btn) { btn.textContent = 'Creating...'; btn.disabled = true; }

          try {
            const shopName = (document.getElementById('reg-shop')?.value || '').trim();
            const phone    = (document.getElementById('reg-phone')?.value || '').trim();
            const email    = (document.getElementById('reg-email')?.value || '').trim();
            const password = document.getElementById('reg-password')?.value || '';

            if (!shopName || !phone || !email || !password) {
              alert('Sab fields bharen!'); return;
            }

            // Step 1: Create account
            const { data, error } = await sb.auth.signUp({
              email, password,
              options: { data: { shop_name: shopName, phone } }
            });

            if (error) { alert('❌ Registration Error:\n' + error.message); return; }

            // Step 2: Save phone → email mapping
            const { error: insertErr } = await sb
              .from('phone_lookup').insert({ phone, email });

            if (insertErr) {
              alert('⚠️ Phone save karne mein masla:\n' + insertErr.message +
                    '\n\nPlease Supabase SQL Editor mein yeh run karein:\nINSERT INTO phone_lookup (phone, email) VALUES (\'' + phone + '\', \'' + email + '\');');
            }

            if (data.session) {
              window.location.reload();
            } else {
              alert('✅ Account ban gaya!\nAb Login tab mein phone number aur password dal kar login karein.');
              window.switchTab && window.switchTab('login');
              const lp = document.getElementById('login-phone');
              if (lp) lp.value = phone;
            }

          } catch(err) {
            alert('Registration Error: ' + err.message);
          } finally {
            if (btn) { btn.textContent = origText; btn.disabled = false; }
          }
        });
      }
    });

    // Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(reg => console.log('Service Worker registered', reg))
          .catch(err => console.error('Service Worker registration failed', err));
      });
    }
  </script>
</body>
</html>
